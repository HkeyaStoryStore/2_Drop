<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKEYA | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#0b0d10',
                            dark: '#101318',
                            gray: '#171b21',
                            accent: '#E3B76B',
                            muted: '#8A94A0',
                            faint: '#4A5360',
                        }
                    },
                    fontFamily: {
                        grotesk: ['Space Grotesk', 'sans-serif']
                    },
                }
            }
        }
    </script>
    <style>
        body { background: #0b0d10; color: #ECEFF1; font-family: 'Space Grotesk', sans-serif; }
        .input-box { background: #171b21; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 24px; transition: all 0.3s ease; }
        .input-box:hover { border-color: rgba(227, 183, 107, 0.2); transform: translateY(-2px); }
        .size-btn { transition: all 0.2s ease; }
        .size-btn.active { background: #E3B76B; color: #0b0d10; border-color: #E3B76B; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #242a33; border-radius: 3px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-5xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12 pb-8 border-b border-white/5">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <img src="drop.png" alt="HKEYA" class="h-8 w-auto">
                    <span class="text-[10px] font-bold tracking-[0.3em] uppercase text-brand-accent px-2 py-1 bg-brand-accent/10 rounded">Admin Portal</span>
                </div>
                <h1 class="text-4xl font-bold tracking-tighter">Inventory Control</h1>
                <p class="text-brand-muted text-sm mt-2">Update store prices and size availability in real-time.</p>
            </div>
            <button onclick="saveToGitHub()" id="saveBtn" class="bg-brand-accent text-brand-black font-bold px-8 py-4 rounded-2xl hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-3 shadow-lg shadow-brand-accent/10">
                <span class="iconify text-xl" data-icon="mdi:cloud-upload"></span>
                <span class="uppercase tracking-widest text-xs">Publish to GitHub</span>
            </button>
        </header>

        <div id="adminList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading state -->
            <div class="col-span-full py-20 text-center opacity-50">
                <span class="iconify text-4xl animate-spin mx-auto mb-4" data-icon="mdi:loading"></span>
                <p class="text-xs uppercase tracking-widest">Loading Catalog...</p>
            </div>
        </div>

        <footer class="mt-20 pt-8 border-t border-white/5 text-center">
            <p class="text-[10px] text-brand-faint uppercase tracking-[0.4em]">HKEYA THE BRAND — DROP 02</p>
        </footer>
    </div>

    <script>
        const GITHUB = {
            token: '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',
            owner: 'HkeyaStoryStore',
            repo: '2_Drop',
            path: 'products.json'
        };

        let products = [];

        async function init() {
            try {
                // Try fetching from GitHub first (always gives the live version)
                const fileResp = await fetch(`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}`, {
                    headers: { 'Authorization': `token ${GITHUB.token}` }
                });

                if (fileResp.ok) {
                    const fileData = await fileResp.json();
                    const content = decodeURIComponent(escape(atob(fileData.content)));
                    products = JSON.parse(content);
                    render();
                    console.log("Loaded from GitHub");
                } else {
                    // Fallback to local fetch
                    const resp = await fetch('products.json?t=' + Date.now());
                    if (!resp.ok) throw new Error("Local load failed");
                    products = await resp.json();
                    render();
                    console.log("Loaded locally");
                }
            } catch (e) {
                console.error(e);
                document.getElementById('adminList').innerHTML = `
                    <div class="col-span-full p-8 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-400 text-center">
                        <span class="iconify text-3xl mb-2 mx-auto" data-icon="mdi:alert-circle"></span>
                        <p class="font-bold">Initialization Error</p>
                        <p class="text-xs mt-1 opacity-70">${e.message === 'Local load failed' ? 'Could not reach GitHub or find products.json' : e.message}</p>
                        <p class="text-[10px] mt-4 uppercase tracking-widest opacity-50">Note: Browser security might block local files. Try hosting it or check your internet.</p>
                    </div>`;
            }
        }

        function render() {
            document.getElementById('adminList').innerHTML = products.map((p, i) => `
                <div class="input-box group">
                    <div class="flex justify-between items-start mb-6">
                        <h3 class="font-bold text-xl tracking-tight group-hover:text-brand-accent transition-colors">${p.name}</h3>
                        <span class="text-[10px] font-bold text-brand-faint uppercase tracking-widest">${p.id}</span>
                    </div>

                    <div class="space-y-6">
                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-brand-faint mb-2 block">Price (DT)</label>
                            <div class="relative">
                                <input type="number" value="${p.price}"
                                       onchange="products[${i}].price = parseInt(this.value)"
                                       class="w-full bg-brand-dark p-4 rounded-xl border border-white/5 focus:border-brand-accent/50 outline-none text-lg font-bold transition-all">
                                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-brand-faint font-bold text-xs">DT</span>
                            </div>
                        </div>

                        <div>
                            <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-brand-faint mb-3 block">Stock Availability</label>
                            <div class="flex flex-wrap gap-2">
                                ${Object.keys(p.sizes).map(size => `
                                    <button onclick="toggleSize(${i}, '${size}')"
                                            class="size-btn flex-1 min-w-[60px] py-3 rounded-xl text-xs font-bold border border-white/10 transition-all ${p.sizes[size] ? 'active shadow-lg shadow-brand-accent/5' : 'bg-brand-dark text-brand-muted opacity-40'}">
                                        ${size}
                                    </button>
                                `).join('')}
                            </div>
                            <p class="text-[9px] mt-3 uppercase tracking-widest text-brand-faint text-center">Tap to toggle stock</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleSize(pIdx, size) {
            products[pIdx].sizes[size] = !products[pIdx].sizes[size];
            render();
        }

        async function saveToGitHub() {
            const btn = document.getElementById('saveBtn');
            const originalHTML = btn.innerHTML;

            btn.innerHTML = '<span class="iconify animate-spin text-xl" data-icon="mdi:loading"></span><span class="uppercase tracking-widest text-xs font-bold">Syncing Data...</span>';
            btn.disabled = true;

            try {
                // 1. Get current SHA
                const fileResp = await fetch(`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}`, {
                    headers: { 'Authorization': `token ${GITHUB.token}` }
                });
                if (!fileResp.ok) throw new Error('Could not fetch file status from GitHub');
                const fileData = await fileResp.json();

                // 2. Push Update
                const response = await fetch(`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Admin: Update inventory pricing/stock',
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2)))),
                        sha: fileData.sha
                    })
                });

                if (response.ok) {
                    alert('SUCCESS: Inventory updated on GitHub. Site will update in ~1 minute.');
                } else {
                    const err = await response.json();
                    throw new Error(err.message || 'Push failed');
                }
            } catch (e) {
                console.error(e);
                alert('ERROR: ' + e.message);
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        init();
    </script>
</body>
</html>
